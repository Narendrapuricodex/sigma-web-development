<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Postion Property Of Css</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        div{
            border: 2px solid black;
            height: 300px;
            width: 200px;
            padding: 0;
            margin: 20px;
            /* position: absolute; */
        }
        p{
            
            border: 2px solid black;
            width: 100px;
            position: absolute;
            top: 0;
        }
    </style>
</head>
<body>
    <div>
        <P>this is a para</P>

    </div>
</body>
</html>


<!-- here are types of main postion property like:- absolute,relative,sticky,fixed -->
