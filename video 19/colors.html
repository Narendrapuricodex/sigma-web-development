<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        h1 {
            color: red;
        }
    </style>
</head>
<body>
    <h1>This is About Color</h1>
    <p>color can be specified in various ways like: 

        <ol>
            <li style="color: red;">color keywords</li>
            <li style="color: #00ff00;">hexadecimal color</li>
            <li style="color: rgb(255, 0, 0);">rgb color</li>
            <li style="color: hsl(120, 100%, 50%);">hsl color</li>
            <li style="color: rgba(255, 0, 0, 0.5);">rgba color</li>
        </ol>
    </p>

    
</body>
</html>
