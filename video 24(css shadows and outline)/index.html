<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Shadow And Outline</title>
    <style>
        div{
            border: 2px solid black;
            padding: 15px;
            box-shadow:  5px 15px 5px #888888;
            text-shadow: 2px 5px 4px red;
        }

        p{
            outline: 2px solid black;
            outline-offset: 4px solid black;
            border-radius: 10px;
            border: 2px solid red;
            padding: 10px
        }
    </style>
</head>
<body>
    <div>This is a box</div>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Nulla vitae ullam totam, nisi suscipit eligendi optio at, temporibus autem quisquam corrupti, aspernatur laudantium id facilis in. Eum ipsam sunt nesciunt quos iste, odit doloribus.</p>


</body>
</html>
