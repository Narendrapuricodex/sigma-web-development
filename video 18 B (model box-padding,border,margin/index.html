<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <style>
        *{margin: 100px;}
        .box1{
            background-color: yellow;
            padding: 20px;
            border: 20px solid blue;
            margin: 20px;
        }

        .box2{
            background-color: green;
            padding: 20px;
            border: 20px solid red;
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="box1">this is div 1</div>
    <div class="box2">this is div 2</div>

</body>
</html>
