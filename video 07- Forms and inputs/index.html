<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Learn it</title>
</head>

<body>
    <form action="post">
        <label for="username">Enter Your Username: </label>
        <input type="text" name="username" id="username" , placeholder="Enter your username">


        <div>
            <label for="male">Male</label>
            <input type="radio" id="male" name="gender" value="male">

            <abel for="female">Female</label>
            <input type="radio" name="gender" id="female">
        </div>
      

        <div>
            <label for="subscribe">subscribe</label>
            <input type="checkbox" id="subscribe" name="subscribe" value="yes">
        </div>

        <div>
            <textarea name="comment" id="comment" placeholder="Enter Your comment" rows="5" cols="20"></textarea>
        </div>

        <div>
            <select name="fruits" id="fruits">
                <option value="apple">apple</option>
                <option value="orange">orange</option>
                <option value="mango">mango</option>
                <option value="pineapple">pineapple</option>
            </select>
        </div>

    </form>
    <label for="Narendra">Narendra</label>
    <input type="checkbox" name="Narendra" id="Narendra">


</body>

</html>
